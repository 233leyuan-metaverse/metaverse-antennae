  short_description: "Generate verified BonesEdit motion drafts"
  default_prompt: "Use $animation-draft to generate and save a verified waving animation draft without loading or playing it."

dependencies:
  tools:
    - type: "mcp"
      value: "sideapi_bridge"
      description: "Local Buildmode editor animation-draft tools"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
